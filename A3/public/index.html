<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A3 Library System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

    <header class="top-bar">
        <div id="user-summary">

            Not logged in
        </div>
        <div class="top-actions">
            <button id="reset-btn" class="btn btn-secondary">Reset System</button>
            <button id="logout-btn" class="btn btn-secondary" style="display:none;">Logout</button>
        </div>
    </header>

    <section id="login-section" class="card">
        <h2>Login</h2>
        <div class="form-row">
            <label for="username">Username</label>
            <input id="username" type="text" placeholder="alice / bob / charlie">
        </div>
        <div class="form-row">
            <label for="password">Password</label>
            <input id="password" type="text" placeholder="pass123 / pass456 / pass789">
        </div>
        <button id="login-btn" class="btn btn-primary">Login</button>
        <p id="login-result" class="text-muted"></p>
    </section>

    <main id="main-content" style="display:none;">

        <section class="card">
            <h2>Notifications</h2>

            <ul id="notif-list" class="notif-list">

            </ul>
        </section>

        <section class="card">
            <h2>My Borrowed Books</h2>
            <table class="table" id="borrowed-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Due Date</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>Book Collection</h2>
            <table class="table" id="books-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Due Date</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </section>
    </main>
</div>

<script src="app.js" defer></script>
</body>
</html>
